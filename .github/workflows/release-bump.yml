name: Bump release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to bump"
        required: true
        default: patch
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: write
  packages: write

jobs:
  # Determine the next version, create the GitHub release and expose the tag.
  bump-release:
    uses: uug-ai/workflows/.github/workflows/release-bump.yml@main
    with:
      bump: ${{ github.event.inputs.bump }}
    secrets: inherit

  # A release created with GITHUB_TOKEN does not emit the `release: created`
  # event, so invoke the existing release pipeline with the generated tag.
  release:
    needs: bump-release
    uses: uug-ai/workflows/.github/workflows/release-create.yml@main
    with:
      organization: uug-ai
      project: ${{ github.event.repository.name }}
      tag: ${{ needs.bump-release.outputs.tag }}
      docker_context: "."
      runner_matrix: >-
        [
          {"architecture":"amd64","runner":"ubuntu-24.04"},
          {"architecture":"arm64","runner":"ubuntu-24.04-arm"}
        ]
      create_gitops_pr: false
    secrets: inherit
